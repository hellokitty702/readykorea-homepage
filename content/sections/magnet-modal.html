<div class="magnet-modal-card">
    <button class="magnet-modal-close" onclick="closeMagnetModal()" aria-label="Close">✕</button>
    <h4 id="magnet-modal-title">Get free access</h4>
    <p>Apply through our teacher registration form. We'll follow up with resources and updates.</p>
    <form onsubmit="submitMagnetModal(event)">
      <input type="email" id="magnet-modal-email" placeholder="you@example.com">
      <button type="submit" class="submit">Submit Resume →</button>
    </form>
    <div class="modal-note">Opens Google Form in a new tab · ReadyKorea teacher updates (≤ 1 email/week).</div>
  </div>
